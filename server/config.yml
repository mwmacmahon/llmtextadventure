# Server configuration. Non-secret. Secrets (ANTHROPIC_API_KEY) come from the
# environment or a .env file at the repo root.

server:
  host: 0.0.0.0        # bind to LAN
  port: 8010
  data_dir: ../data     # sqlite db + usage logs (gitignored)
  content_root: ../notes/content   # per-game creative content (gitignored for now)
  web_dist: ../web/dist            # served as static files if present
  log_dir: ../data/logs            # rotating server.log (5 MB x 5) + console; one line per pipeline step
  log_level: INFO

# Model roles. Each role is configured independently so backends can be mixed.
# provider: anthropic | fake   (set TA_PROVIDER=fake to force fake everywhere)
roles:
  narrator:
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 4096
    effort: low                 # creative prose doesn't need deep thinking
    cache_ttl: 1h
    refusal_fallback: true      # server-side fallback on safety refusal (beta)
  adjudicator:
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 2048
    effort: low
    timeout_seconds: 90
  referee:
    # The referee is the gate that keeps story and state aligned. Measured 2026-10-27 (3 repeats per
    # case): Haiku low 26/33 station, 17/21 noir; Haiku medium 29/33 / 17/21; Sonnet low 33/33 / 18/21
    # at the same latency (~2.5 s). Sonnet costs roughly $0.006 more per turn with the prefix cached.
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 2048
    effort: low
    timeout_seconds: 90
  summarizer:
    # Runs only at window-slide points (every 6 turns), so it can afford the narrator's model:
    # a rich story-so-far is what keeps long games coherent, and Haiku flattens it.
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 2048
    effort: low

context:
  window_turns: 12      # recent turns sent verbatim to the narrator (minimum)
  window_slide: 6       # window start moves in steps of this many turns, so the cache prefix is stable

# List prices, USD per million tokens, for the per-game cost rollup (game properties in the
# lobby). cache_write is the 1h-TTL rate (2x input). Haiku's cache rates are the standard
# multiples of its base price (reads 0.1x, 1h writes 2x); Opus 5.5's 1h write is likewise 2x.
pricing:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 4.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.20}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 8.00}
