[project]
name = "textadventure-server"
version = "0.1.0"
description = "LLM-driven text adventure engine (server)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=2,<3",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls real models and costs money; set TA_LIVE=1 to run (tests/live)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "games*", "modules*"]
