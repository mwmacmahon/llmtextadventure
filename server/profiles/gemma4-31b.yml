# D74, the Gemma 4 31B candidate (survey rank 2, D63): gemma-4-31B-it-uncensored-heretic-Q5_K_M (llmfan46, Heretic v1.2.0,
# 21.8 GB, on the box since 11-02). First a smoke: does llama.cpp's json_schema grammar hold on this model (issue #30256
# said Gemma 4 opens its thought channel under it and needs a GBNF shim); if the structured roles parse, the full
# candidate trial runs (both per-game sets, both referee sets, paired against the anchors). Context auto-sized to the
# free VRAM (Gemma's KV is heavier than the Qwen hybrids'); thinking off everywhere; sampling the server's defaults,
# so the one change against the anchors is the model (the card's 1.0 / 0.95 / 64 is a later ladder, not this run).
model: gemma-4-31B-it-uncensored-heretic-Q5_K_M.gguf
# B382 (11-13): `ctx: auto` never sized anything here: llama.cpp's --fit gives up when the layers are pinned to the GPU
# ("n_gpu_layers already set by user to 999, abort"), so the server took 49,152 tokens a slot, 31.7 GB of the card's 32.6 with
# the weights. Any other use of the card (a Sunshine session, 0.8 GB) and the load failed at the last 1.3 GB, and the unit
# restarted in a loop (20 times on 11-13; the two outages of 11-12 night were the same after an idle sleep). A fixed
# 40,960 a slot leaves about 1.6 GB; the largest narrator prompt in the store is about 20,000 tokens.
# B405 (11-13): four slots, one a role and one for the side calls, 30,720 tokens each (122,880 in all, as before: 1.6 GB of
# the card spare; 131,072 left 0.8 GB, too near B382's edge). The largest narrator prompt in the store is about 20,000.
server: {ctx: 122880, ckpt: 2048, kv: q8_0, think_budget: -1, extra: "--parallel 4"}
# The owner, 11-13: a telling asked for again comes out nearly the same. A retell the player asks for is sampled hotter
# (the server's default is 0.8); change the number here.
roles:
  narrator: {retell_temperature: 1.15}
  # D264: the reading's grammar written with no whitespace between its tokens (the server's own lets the model pad: 27 to 30%
  # of a reading's characters). On 60 stored turns, like for like: 15.3 s to 12.1 with the prompt cold, 9.6 to 5.9 with it
  # cached; 486 output tokens to about 300; no error; the readings alike. The referee's answer is not measured yet.
  assistant: {tight_json: true}
dials:
  stakes: live          # B94 (D176): every profile names it
# D246 (11-12): the telling's word budget by the kind of turn (engine/telling.py). Trial on 20 stored turns: median 162 words to
# 135, nothing settled lost (an Opus reader); fight turns a third shorter.
# D249 (11-13): the schema's field descriptions written into the assistant's and the referee's system text. A hosted model
# gets them with the tool; this model saw the field names only. On 100 stored fantasy turns the engine's settling rewrote 5
# of 50 fight readings against 30 of 50; on the hand-keyed set the referee's forbidden rows fell from 11 to 5.
modules:
  telling_length: short
  field_guide: "on"
