# What each module and dial below is, why it exists and what it measured: docs/LEVERS.md.
# The hosted play (Stage 3): every role on Claude Sonnet 5.5 through Anthropic, as config.yml has them, the stakes live (B94) and
# the checks called, as config.yml has them. The fantasy plays on it. No model file and no server block: nothing is loaded
# on the GPU box, so switching to it is immediate. The guard is rewrite, as on every server (the owner, 11-08, B78: the
# prose streams, and a serious ruling such as too_far or an early tell has it retold once). Each game keeps its own check
# offset (the station's +1).
config: config.yml
note: every role on Claude Sonnet 5.5, hosted
roles:
  narrator: {provider: anthropic, model: claude-sonnet-5-5}
  assistant: {provider: anthropic, model: claude-sonnet-5-5}
  referee: {provider: anthropic, model: claude-sonnet-5-5}
  summarizer: {provider: anthropic, model: claude-sonnet-5-5}
dials:
  stakes: live
  checks: called
  guard: rewrite
# D246 (the owner and Lilith, 11-12: the tellings ran about twice too long): a word budget by the kind of turn (engine/telling.py)
modules:
  telling_length: short
  # D256: the fantasy's reading is at the edge of the grammar's size (one more field is refused), so there it is asked for
  # as a plain tool call, which also carries `leaving` and `goes_to`; every other answer keeps the grammar
  structured_answers: fit
