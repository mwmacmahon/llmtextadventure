# Every role on one local llama-server (llama.cpp), started with --parallel 3 so each role is pinned to its
# own slot and keeps its own KV cache / recurrent state resident between turns. Use it with
#   TA_CONFIG=config.llamacpp.yml TA_LLAMA_URL=http://<gpu-host>:8280 ./dev.sh
# or ./dev.sh local. Thinking is off: the structured roles run under a JSON-schema grammar, and the narrator
# needs time-to-first-token, not deliberation. The model name is informational; the server serves what it loaded.

server:
  host: 0.0.0.0
  port: 8010
  data_dir: ../data
  content_root: ../notes/content
  web_dist: ../web/dist
  log_dir: ../data/logs
  log_level: INFO

# Sampling, explicit per role (2026-10-29). Before this every role sent only a temperature and took the rest
# from llama-game.sh's command line (--temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0, repeat penalty 1.0):
#   narrator 0.7, adjudicator 0.2, referee 0.2, summarizer 0.4.
# Now: the narrator keeps Qwen's recommended general settings (0.7 / 0.8 / 20 / 0); the structured roles
# are greedy (temperature 0) with no repeat penalty. Swept on the A3B against the graded key (2026-10-29,
# DECISIONS D30): the 1.05 penalty cost the referee about ten required rows of 90 (45 -> 56 without it);
# temperature 0.2 without the penalty scored the same but ran two calls into the 1536-token budget, greedy
# none. min_p 0.05 / top_p 0.95 (Qwen's general advice) wrote different rows, mostly unjudged, and truncated
# twice. One run per setting; the dense models get these as their starting point.
roles:
  narrator:
    provider: llamacpp
    model: qwen3.5-35b-a3b
    slot: 0
    max_tokens: 2048
    # max_prompt_tokens: not needed here: the game reads the slot size from the server (/props) after any model swap
    checks: told                   # the engine rolls the assessed checks first; this model writes outcomes before calling (ISSUES §0c)
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    repeat_penalty: 1.0
    timeout_seconds: 240
  adjudicator:
    provider: llamacpp
    model: qwen3.5-35b-a3b
    slot: 1
    max_tokens: 1536              # every field is required under the grammar now (inline_schema): answers run longer
    temperature: 0.0
    top_p: 0.5
    top_k: 20
    min_p: 0.0
    repeat_penalty: 1.0
    timeout_seconds: 120
  referee:
    provider: llamacpp
    model: qwen3.5-35b-a3b
    split: false            # true: three passes (player / world / timers and rulings) over one cached prompt; measure with --opt split=true
    slot: 2
    max_tokens: 1536
    temperature: 0.0
    top_p: 0.5
    top_k: 20
    min_p: 0.0
    repeat_penalty: 1.0
    timeout_seconds: 120
  summarizer:
    provider: llamacpp
    model: qwen3.5-35b-a3b
    slot: 0                     # shares the narrator's slot: it runs only every six turns, between narrations
    max_tokens: 1024
    temperature: 0.3
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    repeat_penalty: 1.05
    timeout_seconds: 180

context:
  window_turns: 12
  window_slide: 6

pricing: {}
