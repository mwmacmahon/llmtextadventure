# The shape of a mod for the clown game (B79; notes/DESIGN-mods-2026-11-08.md). Never offered on the form. A mod is a YAML
# file in this directory; the new-game form shows it as a checkbox with its `about` line; it is applied when a new game
# is made and never after; the save keeps the mod's name, hash and text.
name: Example
about: "One line on what it changes."
game: clown
order: 10

# The house file (scenarios/tumbler_house.yml) as a JSON merge patch: nested keys merge, null deletes; lists of objects with ids
# (girls, people, events, spontaneous, the deck's hooks) are patched by id.
scenario:
  people:
    judge:
      client: {pays: 80}
  girls:
    dot:
      skills: {acrobatics: 60}
      love: 2

# The narrator's prefix by its ALL-CAPS section heading (THE PREMISE, THE TONE, THE PLAYER'S REACH, TRAINING AND THE WEEK,
# THE SHOW, HOW YOU NARRATE, WHAT YOU DO NOT DO, THE GAME STATE): replace a section or append to it. {name} is the proprietor.
prefix:
  append:
    "THE TONE": |
      One more line of voice.

# The assistant's and the referee's rules text, by section heading the same way.
rules:
  assistant:
    append:
      "THE WORDS DECIDE FIRST.": "One more line for the assistant."
  referee:
    append:
      "GAME RULES FOR THE REFEREE": "One more line for the referee."

# The starting state the game built from the setup, as a merge patch (lists with ids patched by id).
state:
  house: {money: 500}
  player:
    stats: {charm: 5}

# The game's own rulings switched off (this game declares none).
rulings_off: []

# The rest of the content, by the loader's own names. By id an item the deck has is edited, a new id is added, an id set to
# null is taken out; a mapping that carries `$replace: true` is the whole thing instead of a patch. Text (prefix) is replaced.
# girl_cards and hooks are by id; words holds what the code otherwise says itself, the referee's guards among them (each a
# `rule` and a `fix`).
# content:
#   girl_cards: {ada_vosk: {voice: "..."}, a_card_of_mine: {id: a_card_of_mine, name: "...", age: 30, ...}, pim_dace: null}
#   hooks: {$replace: true, my_only_booking: {...}}
#   words: {guards: {a_guard_of_mine: {rule: "the telling ...", fix: "Tell the turn again ..."}}}
#
# A whole deck as a file of its own, beside this one: `kind: deck`, name, about, game, and `content` as above with each part
# given whole. Name it here; it is swapped in before `content` above is laid over it. Uploaded and downloaded like a mod.
# decks: [my_cards.yml]
